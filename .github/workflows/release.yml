# Sempre que ha push para main: compila o AllyHub.exe e publica um release
# com a versao que esta em AllyHub.csproj (<Version>). Para lancar uma
# atualizacao, sobe esse numero (ex.: 1.0.0 -> 1.0.1) e faz push.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ler versao
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content AllyHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Compilar
        run: dotnet publish AllyHub.csproj -c Release -o publicar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AllyHub v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: publicar/AllyHub.exe
